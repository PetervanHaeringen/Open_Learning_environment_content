questions:

  - id: softwaretesten.m01.q01
    type: mcq
    prompt: Какова главная цель тестирования программного обеспечения?

    options:
      - id: a
        text: Доказать, что программа не содержит ошибок
      - id: b
        text: Проверить, работает ли программа так, как ожидается
      - id: c
        text: Сделать программу быстрее

    answer: b

    hint: Подумайте о поведении и качестве.

    feedback:
      correct: Хорошо подмечено.
      incorrect: Пока не совсем верно.

    explanation: Тестирование помогает сделать качество видимым.

  - id: softwaretesten.m01.q02
    type: truefalse
    prompt: Тестирование может доказать, что программа полностью свободна от ошибок.

    answer: false

    explanation: Тестирование может выявить ошибки, но не может доказать их отсутствие.

  - id: softwaretesten.m01.q03
    type: open
    prompt: Назовите один пример того, что вы бы проверили как тестировщик.

    sample_answer: Например, работает ли кнопка.

    keywords:
      - кнопка
      - форма
      - сообщение об ошибке

    explanation: Обратите внимание на поведение, важное для пользователей.
