questions:

  - id: softwaretesten.m01.q01
    type: mcq
    prompt: 소프트웨어 테스팅의 가장 중요한 목적은 무엇인가요?

    options:
      - id: a
        text: 소프트웨어에 오류가 없음을 증명하는 것
      - id: b
        text: 소프트웨어가 기대한 대로 작동하는지 조사하는 것
      - id: c
        text: 소프트웨어를 더 빠르게 만드는 것

    answer: b

    hint: 동작과 품질을 생각해 보세요.

    feedback:
      correct: 잘 찾으셨습니다.
      incorrect: 아직 정답이 아닙니다.

    explanation: 테스팅은 품질을 눈에 보이게 만드는 데 도움이 됩니다.

  - id: softwaretesten.m01.q02
    type: truefalse
    prompt: 테스팅은 소프트웨어에 오류가 전혀 없음을 증명할 수 있다.

    answer: false

    explanation: 테스팅은 오류를 드러낼 수는 있지만, 오류가 없음을 증명할 수는 없습니다.

  - id: softwaretesten.m01.q03
    type: open
    prompt: 테스터로서 확인할 만한 예시를 하나 들어보세요.

    sample_answer: 예를 들어, 버튼이 작동하는지 여부.

    keywords:
      - 버튼
      - 양식
      - 오류 메시지

    explanation: 사용자에게 중요한 동작을 살펴보세요.
